<title>Алгоритмический детектив</title>
<style>
/* Layout: страница задачи как в онлайн-тренажёрах кода. Шапка, две панели (условие и вкладки слева; редактор, консоль и нижняя панель действий справа), список дел в боковом ящике. */
:root {
  --bg: #F1F2F5;
  --pane: #FFFFFF;
  --pane-2: #F1F2F5;
  --pane-3: #E3E5EA;
  --code-block: #F3F4F7;
  --line: #DFE1E6;
  --ink: #16181D;
  --ink-2: #646B78;
  --tab: #5B5BF0;
  --accent: #C0352E;
  --accent-soft: #F8DEDB;
  --xp: #E9B51F;
  --on-xp: #2A2000;
  --go: #1F9D4D;
  --on-go: #FFFFFF;
  --easy: #1B8A4A;
  --easy-soft: #D8F0E2;
  --med: #A35F00;
  --med-soft: #FBEACB;
  --ok: #1B8A4A;
  --ok-soft: #D8F0E2;
  --warn: #A35F00;
  --warn-soft: #FBEACB;
  --badge: #16181D;
  --ex-label: #0E8F73;
  --num: #1A8A4F;
  --bool: #2563D6;
  --str: #B4531C;
  --h-k: #0451A5;
  --h-kc: #AF00DB;
  --h-s: #A31515;
  --h-n: #098658;
  --h-f: #795E26;
  --h-c: #6A9955;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1A1C; --pane: #262628; --pane-2: #2F2F32; --pane-3: #3B3B3F; --code-block: #1D1D1F; --line: #3C3C40;
    --ink: #F3F3F4; --ink-2: #A2A2A8; --tab: #8B8BFF;
    --accent: #FF7568; --accent-soft: #3A1F22; --xp: #F0C14B; --on-xp: #2A2000;
    --go: #2CBB5D; --on-go: #04210F; --easy: #4FD08A; --easy-soft: #1B3A2A; --med: #F2B84B; --med-soft: #3D3016;
    --ok: #4FD08A; --ok-soft: #1B3A2A; --warn: #F2B84B; --warn-soft: #3D3016; --badge: #3B3B3F;
    --ex-label: #4EC9B0; --num: #8FD6A0; --bool: #6AB0FF; --str: #E3A27A;
    --h-k: #569CD6; --h-kc: #C586C0; --h-s: #CE9178; --h-n: #B5CEA8; --h-f: #DCDCAA; --h-c: #6A9955;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1A1C; --pane: #262628; --pane-2: #2F2F32; --pane-3: #3B3B3F; --code-block: #1D1D1F; --line: #3C3C40;
  --ink: #F3F3F4; --ink-2: #A2A2A8; --tab: #8B8BFF;
  --accent: #FF7568; --accent-soft: #3A1F22; --xp: #F0C14B; --on-xp: #2A2000;
  --go: #2CBB5D; --on-go: #04210F; --easy: #4FD08A; --easy-soft: #1B3A2A; --med: #F2B84B; --med-soft: #3D3016;
  --ok: #4FD08A; --ok-soft: #1B3A2A; --warn: #F2B84B; --warn-soft: #3D3016; --badge: #3B3B3F;
  --ex-label: #4EC9B0; --num: #8FD6A0; --bool: #6AB0FF; --str: #E3A27A;
  --h-k: #569CD6; --h-kc: #C586C0; --h-s: #CE9178; --h-n: #B5CEA8; --h-f: #DCDCAA; --h-c: #6A9955;
  color-scheme: dark;
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--pane-3) transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.6 var(--font-body); }
button, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--tab); outline-offset: 2px; }
code { font-family: var(--font-mono); font-size: .92em; }
svg { flex: none; }
.label { font: 600 11px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.shell { position: relative; height: 100%; display: flex; flex-direction: column; min-height: 0; }

/* header */
.hdr { flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; }
.hdr-l, .hdr-r { display: flex; align-items: center; gap: 6px; min-width: 0; }
.logo { display: grid; place-items: center; width: 32px; height: 32px; color: var(--ink); }
.hbtn { display: inline-flex; align-items: center; gap: 8px; min-width: 0; background: transparent; border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 14px; }
.hbtn .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ibtn { display: grid; place-items: center; width: 30px; height: 30px; background: transparent; border: 0; border-radius: 8px; color: var(--ink); }
.ibtn.sm { width: 28px; height: 28px; }
.ibtn.arm { color: var(--accent); }
.hbtn:hover, .ibtn:hover, .logo:hover { background: var(--pane-2); }
.xpchip { display: flex; align-items: center; gap: 10px; background: var(--pane); border: 1px solid var(--line); border-radius: 10px; padding: 4px 12px 4px 4px; }
.xpchip:hover { border-color: var(--ink-2); }
.badge { background: var(--badge); color: var(--xp); width: 26px; height: 30px; display: grid; place-items: center; border-radius: 7px; }
.rank-info { display: grid; gap: 4px; min-width: 92px; text-align: left; }
.rank-name { font: 700 12px/1 var(--font-body); text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; }
.bar { height: 4px; background: var(--pane-3); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--xp); transition: width .5s ease; }
.rank-xp { font: 600 12px var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank-xp b { color: var(--ink); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; background: var(--pane-3); color: var(--ink); border: 1px solid transparent; border-radius: 8px; padding: 4px 16px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover:not(:disabled) { filter: brightness(1.1); }
.btn.go { background: var(--go); color: var(--on-go); }
.btn.pro { background: var(--tab); color: #fff; }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--ink-2); filter: none; }
.btn.small { min-height: 26px; padding: 2px 10px; font-size: 12.5px; }
.btn:disabled, .btn.is-off { opacity: .45; cursor: not-allowed; }
.tbtn.is-off, .mitem.is-off { opacity: .5; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; font-size: 12.5px; text-align: left; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 19; }
.drawer { position: fixed; top: 0; left: 0; bottom: 0; width: min(980px, 100vw); z-index: 20; background: var(--pane); border-right: 1px solid var(--line); display: flex; flex-direction: column; box-shadow: 12px 0 40px rgba(0, 0, 0, .35); }
.drawer-h { padding: 14px 20px 10px; display: grid; gap: 12px; }
.dh-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dtitle { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dtitle b { font-size: 16px; }
.listpill { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 3px 12px; font-weight: 600; font-size: 13px; background: var(--pane-2); }
.dprog { display: grid; gap: 6px; font: 600 12px var(--font-mono); color: var(--ink-2); max-width: 420px; }
.dtool { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.search { flex: 1 1 240px; max-width: 360px; display: flex; align-items: center; gap: 8px; background: var(--pane-2); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; color: var(--ink-2); }
.search input { flex: 1; min-width: 0; background: none; border: 0; padding: 8px 0; outline: none; color: var(--ink); }
.pager { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pager span { margin-right: 6px; }
.pager .ibtn:disabled { opacity: .35; cursor: not-allowed; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; background: transparent; font-size: 12.5px; font-weight: 600; }
.chip span { color: var(--ink-2); font-family: var(--font-mono); margin-left: 2px; }
.chip:hover { border-color: var(--ink-2); }
.chip.on { background: var(--tab); border-color: var(--tab); color: #fff; }
.chip.on span { color: rgba(255, 255, 255, .8); }
.thead, .trow { display: grid; grid-template-columns: 64px 56px minmax(0, 1fr) 110px 80px; align-items: center; gap: 8px; padding: 0 20px; }
.thead { flex: none; height: 40px; border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); font: 600 11.5px/1 var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.thead button { background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; text-align: left; }
.thead button:hover { color: var(--ink); }
.thead button:nth-of-type(2) { text-align: center; }
.dlist { flex: 1; min-height: 0; overflow: auto; }
.trow { min-height: 50px; border-bottom: 1px solid var(--line); cursor: pointer; }
.trow:hover { background: var(--pane-2); }
.trow.done { background: color-mix(in srgb, var(--go) 9%, var(--pane)); }
.trow.on { background: color-mix(in srgb, var(--tab) 22%, var(--pane)); }
.trow.locked { opacity: .6; cursor: not-allowed; }
.c-st { display: grid; place-items: center start; }
.dst { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--pane-3); display: grid; place-items: center; color: var(--ink-2); }
.trow.done .dst { background: var(--go); border-color: var(--go); color: var(--on-go); }
.star { display: grid; place-items: center; width: 30px; height: 30px; background: none; border: 0; border-radius: 8px; color: var(--ink-2); }
.star:hover { background: var(--pane-3); color: var(--xp); }
.star.on { color: var(--xp); }
.star.on svg { fill: currentColor; }
.c-star { display: grid; place-items: center; }
.c-name { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; padding: 6px 0; }
.tname { background: none; border: 0; padding: 0; text-align: left; font-weight: 500; font-size: 14.5px; overflow-wrap: anywhere; }
.ext { display: grid; place-items: center; color: var(--ink-2); padding: 2px; border-radius: 6px; }
.ext:hover { color: var(--tab); background: var(--pane-3); }
.badge-t { font: 600 10.5px var(--font-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--tab); border: 1px solid var(--tab); border-radius: 6px; padding: 0 6px; line-height: 16px; }
.c-d { font: 700 12.5px var(--font-mono); text-align: center; }
.c-d.easy { color: var(--easy); }
.c-d.medium { color: var(--med); }
.c-d.hard { color: var(--accent); }
.c-d.mine { color: var(--ink-2); }
.c-p { font: 600 12px var(--font-mono); color: var(--ink-2); text-align: center; }
.drawer-f { flex: none; border-top: 1px solid var(--line); padding: 12px 20px; }
.drawer-f summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
.form-grid { display: grid; gap: 8px; margin-top: 10px; max-width: 560px; }
.field { width: 100%; min-width: 0; background: var(--pane-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; resize: vertical; line-height: 1.5; }
.field:focus { border-color: var(--tab); outline: none; }
.stmt { display: grid; gap: 10px; margin: 14px 0; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; }
.stmt p { margin: 0; color: var(--ink-2); }
.stmt .row { display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 720px) {
  .thead, .trow { grid-template-columns: 44px minmax(0, 1fr) 84px; padding: 0 14px; }
  .thead .c-star, .trow .c-star, .thead .c-p, .trow .c-p { display: none; }
  .thead > span:first-child { visibility: hidden; }
  .drawer-h { padding: 12px 14px 8px; }
  .drawer-f { padding: 12px 14px; }
}

/* split */
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--left, 44%) 12px minmax(0, 1fr); padding: 0 16px 16px; }
.shell.max .split { grid-template-columns: minmax(0, 1fr); }
.shell.max .pane.left, .shell.max .gutter.v { display: none; }
.pane { background: var(--pane); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.gutter { position: relative; touch-action: none; }
.gutter::after { content: ''; position: absolute; left: 50%; top: 50%; border-radius: 3px; background: var(--pane-3); transform: translate(-50%, -50%); transition: background .15s; }
.gutter:hover::after, .gutter.drag::after, .gutter:focus-visible::after { background: var(--ink-2); }
.gutter.v { cursor: col-resize; }
.gutter.v::after { width: 4px; height: 30px; }
.gutter.h { flex: none; height: 12px; cursor: row-resize; }
.gutter.h::after { width: 30px; height: 4px; }

/* left pane */
.tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 7px; background: none; border: 0; padding: 12px 12px 10px; color: var(--ink-2); font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--tab); }
.tab.on svg { color: var(--tab); }
.pane-body { overflow: auto; padding: 20px 22px 28px; flex: 1; min-height: 0; }
.ptitle h1 { margin: 0 0 12px; font: 700 18px/1.3 var(--font-body); overflow-wrap: anywhere; }
.pmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.pill-d { padding: 0 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; line-height: 24px; }
.pill-d.easy { background: var(--easy-soft); color: var(--easy); }
.pill-d.medium { background: var(--med-soft); color: var(--med); }
.pill-d.mine { background: var(--pane-3); color: var(--ink-2); }
.pill-o { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid var(--line); border-radius: 99px; background: transparent; font-size: 12.5px; font-weight: 500; line-height: 22px; }
.pill-o:hover { border-color: var(--ink-2); }
a.pill-o { color: var(--ink); text-decoration: none; }
.pill-o.on { background: var(--pane-2); }
.pill-o.gold { color: var(--med); }
.tag-boss { font: 700 11px var(--font-body); letter-spacing: .12em; text-transform: uppercase; background: var(--accent); color: #fff; padding: 2px 10px; border-radius: 99px; line-height: 20px; }
.reveal { margin: 4px 0 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--pane-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.reveal p { margin: 0; color: var(--ink-2); }
.tagchip { border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; background: var(--pane); font-size: 12.5px; }
.prose { margin-top: 12px; }
.prose p { margin: 0 0 12px; white-space: pre-wrap; max-width: 72ch; line-height: 1.75; }
code.ic { background: var(--pane-2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 12.5px; }
.exh { font-weight: 700; margin: 20px 0 10px; }
.excode { background: var(--code-block); border-radius: 10px; padding: 16px; font: 13.5px/1.7 var(--font-mono); display: grid; gap: 14px; overflow-x: auto; }
.excode .k { color: var(--ex-label); }
.tn { color: var(--num); }
.tb { color: var(--bool); }
.ts { color: var(--str); }
.excode .n { font: 400 12.5px var(--font-body); color: var(--ink-2); }
.cons { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.cons li { font: 13px/1.6 var(--font-mono); }
.acc { margin-top: 18px; border: 1px solid var(--line); border-radius: 10px; }
.acc summary { cursor: pointer; padding: 10px 14px; font-weight: 600; }
.acc div { padding: 0 14px 12px; color: var(--ink-2); }
.stamp { font: 800 20px var(--font-body); text-transform: uppercase; letter-spacing: .14em; color: var(--accent); border: 3px double var(--accent); padding: 4px 16px; transform: rotate(-6deg); display: inline-block; opacity: .92; }
.solved { display: grid; gap: 10px; padding: 16px; margin-bottom: 18px; border: 2px solid var(--accent); border-radius: 12px; justify-items: start; }
.solved h3 { margin: 0; font: 700 17px var(--font-body); }
.solved p { margin: 0; max-width: 60ch; }
.solved blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--xp); background: var(--pane-2); font-size: 13.5px; white-space: pre-wrap; max-width: 60ch; border-radius: 0 8px 8px 0; }
.sum { display: grid; gap: 8px; margin-bottom: 14px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.srow { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 9px 10px; border: 0; border-radius: 8px; background: transparent; }
.srow:hover { background: var(--pane-2); }
.srow.cur { background: var(--pane-2); box-shadow: inset 3px 0 0 var(--tab); }
.srow.lock { opacity: .45; cursor: not-allowed; }
.sn { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--pane-3); display: grid; place-items: center; font: 600 11px var(--font-mono); color: var(--ink-2); }
.srow.ok .sn { background: var(--go); border-color: var(--go); color: var(--on-go); }
.srow.half .sn { border-color: var(--warn); color: var(--warn); }
.sname { display: grid; min-width: 0; font-weight: 600; }
.sname small { font-weight: 400; font-size: 12px; color: var(--ink-2); }
.sxp { font: 600 11.5px var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tips ol, .tips ul { margin: 0 0 12px; padding-left: 20px; display: grid; gap: 8px; max-width: 64ch; }
.tips p { max-width: 64ch; }
.ach-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ach { display: grid; gap: 1px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--ink-2); }
.ach b { font-weight: 600; }
.ach small { font-size: 12px; }
.ach.on { border: 1px solid var(--xp); background: color-mix(in srgb, var(--xp) 14%, var(--pane)); color: var(--ink); }

/* right pane */
.tb1, .tb2 { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; }
.tb1 { border-bottom: 1px solid var(--line); }
.tb2 { position: relative; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tl, .tr { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lang { display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 0; font-weight: 600; font-size: 13.5px; padding: 3px 8px; border-radius: 8px; }
.lang:hover { background: var(--pane-2); }
.auto { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); padding-left: 6px; }
.auto i { width: 6px; height: 6px; border-radius: 50%; background: var(--go); }
.ftab { background: var(--pane-2); border-radius: 8px; padding: 3px 12px; font-size: 12.5px; font-weight: 500; }
.xp-tag { font: 600 12px var(--font-mono); background: var(--xp); color: var(--on-xp); padding: 2px 12px 2px 18px; clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%); font-variant-numeric: tabular-nums; }
.tbtn { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-weight: 500; font-size: 13px; }
.tbtn:hover:not(:disabled) { border-color: var(--ink-2); }
.tbtn:disabled { opacity: .5; cursor: not-allowed; }
.tbtn.bot svg { color: var(--tab); }
.tbtn.bulb svg { color: var(--xp); }
.vsep { width: 1px; height: 16px; background: var(--line); }

    next: function () { var p = prog(curId); p.scene = Math.min(p.scene + 1, SCENES.length - 1); cTab = 'mentor'; persist(); renderCase(); },
    skip: function () { var c = curCase(), p = prog(c.id), sc = SCENES[p.scene]; p.results[sc.id] = { res: 'PARTIAL', xp: 0 }; p.lastRes[sc.id] = 'PARTIAL'; if (!p.done && SCENES.every(function (s) { return p.results[s.id]; })) closeCase(c, p); persist(); afterSettle(c, sc); },
    stop: function () { if (ctl) ctl.abort(); },
    nextCase: function () { var nx = nextOpenCase(curCase()); if (nx) selectCase(nx.id); },
    toggleConsole: function () { if (consoleOpen) closeConsole(); else openConsole(); },
    toggleTopics: function () { topicsOpen = !topicsOpen; renderLeft(); },
    toggleHints: function () { hintsOpen = !hintsOpen; renderLeft(); },
    hintMenu: function () { var m = $('#hintMenu'); if (m) m.hidden = !m.hidden; },
    askOpen: function () { hideHintMenu(); setCTab('ask'); var q = $('#qbox'); if (q) q.focus(); },
    goAch: function () { leftTab = 'ach'; shell.classList.remove('max'); renderLeft(); var lb = $('#leftBody'); if (lb) lb.scrollTop = 0; },
    maxToggle: function () { shell.classList.toggle('max'); },
    resetCode: function () {
      if (!codeArm) { codeArm = true; toast('Нажми ещё раз, чтобы сбросить код к шаблону'); renderRight(); setTimeout(function () { if (codeArm) { codeArm = false; renderRight(); } }, 3000); return; }
      codeArm = false; var c = curCase(), p = prog(c.id); p.code = null; persist(); renderRight();
    },
    star: function (b) { var s = b.dataset.slug; if (state.stars[s]) delete state.stars[s]; else state.stars[s] = 1; persist(); renderDrawer(); },
    dChip: function (b) { dDiff = b.dataset.v; dPage = 0; renderDrawer(); },
    dStarOnly: function () { dStar = !dStar; dPage = 0; renderDrawer(); },
    dPrev: function () { dPage--; renderDrawer(); },
    dNext: function () { dPage++; renderDrawer(); },
    dSortDiff: function () { dSort = { k: 'diff', dir: dSort.k === 'diff' ? -dSort.dir : 1 }; dPage = 0; renderDrawer(); },
    dSortName: function () { dSort = { k: 'title', dir: dSort.k === 'title' ? -dSort.dir : 1 }; dPage = 0; renderDrawer(); },
    saveStmt: function () {
      var c = curCase(), v = ($('#stmtText').value || '').trim();
      if (v.length < 20) { toast('Вставь условие целиком'); return; }
      state.stmts[c.id] = v.slice(0, 6000); stmtEdit = false; persist(); renderLeft(); toast('Условие сохранено');
    },
    editStmt: function () { stmtEdit = true; renderLeft(); var t = $('#stmtText'); if (t) t.focus(); },
    cancelStmt: function () { stmtEdit = false; renderLeft(); },
    del: function () {
      if (!delArm) { delArm = true; renderLeft(); return; }
      var id = curId; state.custom = state.custom.filter(function (c) { return c.id !== id; }); delete state.cases[id]; delete state.stmts[id]; delArm = false;
      curId = CASES[0].id; persist(); renderCase();
    }
  };
  shell.addEventListener('click', function (e) {
    var t = e.target;
    var b = t.closest('[data-act]');
    if (b && !b.disabled && ACTS[b.dataset.act]) {
      if (b.classList.contains('is-off')) { explainOff(b); return; }
      try { ACTS[b.dataset.act](b); } catch (err) { toast('Ошибка: ' + (err && err.message || err)); if (window.console) console.error(err); }
      return;
    }
    if (t.closest('a.ext')) return;
    var cs = t.closest('[data-case]'); if (cs) { selectCase(cs.dataset.case); return; }
    var lt = t.closest('[data-lt]'); if (lt) { leftTab = lt.dataset.lt; renderLeft(); return; }
    var ct = t.closest('[data-ct]'); if (ct) { setCTab(ct.dataset.ct); if (ct.dataset.ct === 'ask') { var q = $('#qbox'); if (q) q.focus(); } return; }
    if (t.closest('#listBtn')) { if (drawer.hidden) openDrawer(); else closeDrawer(); return; }
    if (t.closest('#dClose') || t === scrim) { closeDrawer(); return; }
    if (t.closest('#prevBtn')) { stepCase(-1); return; }
    if (t.closest('#nextBtn')) { stepCase(1); return; }
    if (t.id === 'resetBtn') {
      if (!resetArm) { resetArm = true; renderLeft(); return; }
      resetArm = false; state = freshState(); curId = CASES[0].id; lastRun = {}; leftTab = 'desc'; persist(); renderAll(); renderDrawer(); toast('Прогресс сброшен'); return;
    }
    if (t.id === 'cMake') {
      var ti = $('#cTitle').value.trim() || 'Моя задача', s = $('#cText').value.trim();
      if (s.length < 20) { toast('Вставь условие задачи целиком'); return; }
      var id = 'u' + Date.now().toString(36); state.custom.push({ id: id, title: ti }); state.stmts[id] = s.slice(0, 6000);
      $('#cTitle').value = ''; $('#cText').value = ''; persist(); selectCase(id); return;
    }
  });
  document.addEventListener('click', function (e) {
    var m = $('#hintMenu'); if (m && !m.hidden && !e.target.closest('#hintMenu') && !e.target.closest('#hintBtn')) m.hidden = true;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (!drawer.hidden) { closeDrawer(); $('#listBtn').focus(); } hideHintMenu(); }
  });
  shell.addEventListener('input', function (e) {
    var p = prog(curId), t = e.target;
    if (t.id === 'dq') { dq = t.value; dPage = 0; renderDrawer(); return; }
    if (t.id === 'answer') p.answers[SCENES[p.scene].id] = t.value;
    else if (t.id === 'code') { p.code = t.value; updEditor(); } else return;
    persist(); updPos();
  });
  shell.addEventListener('scroll', function (e) { if (e.target.id === 'code') syncScroll(); }, true);
  ['keyup', 'mouseup', 'focusin'].forEach(function (ev) { shell.addEventListener(ev, function (e) { if (e.target.id === 'code' || e.target.id === 'answer') updPos(); }); });
  shell.addEventListener('keydown', function (e) {
    if (e.target.id === 'code' && e.key === 'Tab') {
      e.preventDefault(); var t = e.target, s = t.selectionStart; t.value = t.value.slice(0, s) + '  ' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = s + 2; t.dispatchEvent(new Event('input', { bubbles: true }));
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      var b = e.target.id === 'code' ? ($('[data-act="submitCode"]') || $('[data-act="review"]')) : $('[data-act="submit"]'); if (b && !b.disabled) b.click();
    }
    if (e.target.id === 'code' && (e.ctrlKey || e.metaKey) && e.key === "'") { e.preventDefault(); var r = $('[data-act="run"]'); if (r && !r.disabled) r.click(); }
  });

  /* ---------- resizable panes ---------- */
  function saveLayout() { try { localStorage.setItem(LSL, JSON.stringify(layout)); } catch (e) {} }
  function setLeft(pct) { pct = Math.max(28, Math.min(68, pct)); layout.left = pct; split.style.setProperty('--left', pct + '%'); }
  function setCon(h) { h = Math.max(120, Math.min(Math.max(120, paneR.getBoundingClientRect().height - 300), h)); layout.con = h; paneR.style.setProperty('--console', h + 'px'); }
  function bindGutter(el, onMove) {
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (x) {}
      el.classList.add('drag');
      var mv = function (ev) { onMove(ev); };
      var up = function () { el.classList.remove('drag'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); saveLayout(); };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  }
  bindGutter($('#gv'), function (ev) { var r = split.getBoundingClientRect(); setLeft((ev.clientX - r.left) / r.width * 100); });
  bindGutter($('#gh'), function (ev) { var cons = $('#rFoot').getBoundingClientRect(); setCon(cons.top - ev.clientY); });
  $('#gv').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setLeft((layout.left || 44) + (e.key === 'ArrowRight' ? 3 : -3)); saveLayout(); }
  });
  $('#gh').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); setCon((layout.con || 220) + (e.key === 'ArrowUp' ? 24 : -24)); saveLayout(); }
  });
  if (layout.left) setLeft(layout.left);
  if (layout.con) paneR.style.setProperty('--console', layout.con + 'px');

  var lastErrAt = 0;
  function surface(msg) { var n = Date.now(); if (n - lastErrAt > 4000) { lastErrAt = n; toast(msg); } }
  window.addEventListener('error', function (e) { surface('Ошибка в приложении: ' + (e.message || 'неизвестная')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; surface('Ошибка: ' + ((r && (r.message || r.code)) || 'запрос не выполнен')); });

  /* ---------- boot ---------- */
  curId = validStart(state.last);
  renderAll(); renderDrawer();

  setTimeout(syncDraft, 800);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) syncDraft(); });

  var cl = window.claude;
  if (cl && cl.use) {
    cl.use('sample').then(function (s) { sampleFn = s; sampleState = s ? 'ready' : 'off'; refreshNotice(); refreshButtons(); }, function () { sampleState = 'off'; refreshNotice(); });
    Promise.all([cl.use('db'), cl.use('user')]).then(function (a) {
      var db = a[0], user = a[1]; if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return null;
        profileRef = db.doc('data/users/' + id + '/profile');
        return profileRef.get().then(function (snap) {
          if (!snap.exists) { dirty = true; flush(); return null; }
          var d = JSON.parse(JSON.stringify(snap.data()));
          if (d.cases) { adopt(normalize(d), true); flush(); return null; }
          return profileRef.collection('cases').limit(500).get().then(function (qs) {
            var st = normalize(d); st.cases = {}; st.stmts = {};
            qs.docs.forEach(function (x) { var v = JSON.parse(JSON.stringify(x.data() || {})); if (v.progress) st.cases[x.id] = v.progress; if (v.stmt) st.stmts[x.id] = v.stmt; });
            st.custom.forEach(function (c) { if (c.statement) { st.stmts[c.id] = c.statement; delete c.statement; } });
            adopt(st, false);
          });
        });
      });
    }).catch(function () {});
  } else { sampleState = 'off'; refreshNotice(); }
})();
</script>
