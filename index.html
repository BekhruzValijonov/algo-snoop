    var prompt = sceneBlock(c, p, sc, i) + work + '\n\nВОПРОС УЧЕНИКА:\n"""\n' + q + '\n"""\n\nОтветь понятно и по существу: объясни, приведи пример, помоги сдвинуться с места. Не давай только готовый код решения целиком. В последней строке выведи маркер [[Q:GOOD]], если из вопроса понятно, что именно непонятно ученику, либо [[Q:WEAK]], если вопрос совсем общий. Даже при WEAK сначала помоги, а в конце одной строкой подскажи, как спросить точнее.';
    mentor('Ответ на вопрос', prompt).then(function (full) {
      if (full == null) return;
      var m = parseMarkers(full); p.fb[sc.id] = { kind: 'Ответ на вопрос', text: m.clean };
      if (m.q === 'GOOD' && p.q < 3) { p.q++; addXp(5); }
      persist();
    });
  }
  function onReview() {
    syncDraft();
    var c = curCase(), p = prog(c.id), i = p.scene, sc = SCENES[i], code = ($('#code').value || '').trim();
    p.code = $('#code').value;
    if (needStmt(c)) return;
    if (code.length < 25) { toast('Сначала напиши код решения'); return; }
    var info = lastRun[c.id] ? '\nПоследний запуск тестов: ' + (p.lastSummary || 'нет данных') : '';
    var prompt = sceneBlock(c, p, sc, i) + '\n\nКОД УЧЕНИКА (данные):\n"""\n' + code + '\n"""' + info + '\n\nПроверь код по условию: правильность (мысленно пройди по примерам и крайним случаям), сложность по времени и памяти, читаемость. Начни с того, что получилось. Потом назови одну-две главные проблемы и объясни, как их исправить. Не переписывай код целиком; если ошибка мелкая, можно показать одну исправленную строку.' + FORMAT;
    mentor('Ревью кода', prompt).then(function (full) {
      if (full == null) return;
      var m = parseMarkers(full); p.fb[sc.id] = { kind: 'Ревью кода', text: m.clean }; p.tries[sc.id] = (p.tries[sc.id] || 0) + 1;
      var xpByReview = !c.tests || p.noSandbox;
      if (xpByReview && m.res) { if (m.res !== 'RETRY') p.runs = Math.max(p.runs, 1); settle(c, p, sc, m.res); afterSettle(c, sc); }
      else if (xpByReview) toast('Наставник не вынес вердикт. Запроси ревью ещё раз');
      persist();
    });
  }
  function runCode(all) {
    var c = curCase(), p = prog(c.id), sc = SCENES[p.scene], code = $('#code').value;
    p.code = code; if (all) p.runs++; persist();
    setCTab('tests');
    var out = $('#testOut'); if (out) out.innerHTML = '<p class="muted">' + (all ? 'Запускаю все тесты…' : 'Проверяю примеры…') + '</p>';
    setBusy(true);
    runTests(c, code, !all).then(function (r) {
      var t = testHTML(r, c, all); lastRun[c.id] = t.html; p.lastSummary = (all ? 'отправка, ' : 'запуск примеров, ') + t.summary;
      if (r.sandbox) p.noSandbox = true;
      var o = $('#testOut'); if (o && curCase().id === c.id) o.innerHTML = t.html;
      if (all && t.all) {
        if (p.runs === 1) p.firstPass = true;
        settle(c, p, sc, 'PASS', Math.max(20, 50 - 10 * (p.runs - 1)));
        persist(); afterSettle(c, sc);
      } else persist();
      setBusy(false);
      if (r.sandbox) renderFoot();
    });
  }
  function runTests(c, code, smallOnly) {
    return new Promise(function (resolve) {
      var tests = c.tests(), res = [], url, w, finished = false, tm;
      if (smallOnly) tests = tests.filter(function (t) { return !t.label; });
      function fin(x) { if (finished) return; finished = true; clearTimeout(tm); try { if (w) w.terminate(); } catch (e) {} try { if (url) URL.revokeObjectURL(url); } catch (e) {} resolve(x); }
      tm = setTimeout(function () { fin({ timeout: true, tests: tests, res: res }); }, 5000);
      try { url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })); w = new Worker(url); }
      catch (e) { fin({ sandbox: true, message: String(e && e.message || e) }); return; }
      w.onerror = function (ev) { if (ev.preventDefault) ev.preventDefault(); fin({ sandbox: true, message: ev.message || 'worker error' }); };
      w.onmessage = function (ev) {
        var d = ev.data;
        if (d.fatal) fin({ fatal: d.fatal, name: d.name, sandbox: d.name === 'EvalError', message: d.fatal });
        else if (d.done) fin({ tests: tests, res: res });
        else res[d.i] = d;
      };
      w.postMessage({ code: code, fn: c.fn, wrap: c.wrap || '', cases: tests.map(function (t) { return t.args; }) });
    });
  }
  function testHTML(r, c, all) {
    if (r.sandbox) return { all: false, summary: 'тесты не запускались', html: '<p class="fail">Эта среда не разрешает запуск кода (' + esc(r.message || 'EvalError') + '). Нажми «Сдать на ревью»: наставник проверит решение рассуждением и выставит оценку.</p>' };
    if (r.fatal) return { all: false, summary: 'ошибка: ' + r.fatal, html: '<p class="fail">' + (r.name === 'SyntaxError' ? 'Ошибка синтаксиса: ' : '') + esc(r.fatal) + '</p>' };
    var rows = '', pass = 0;
    r.tests.forEach(function (t, i) {
      var x = r.res[i], ok = false, msg;
      if (!x) msg = (r.timeout && i === r.res.length) ? 'не уложился во время (5 с на все тесты): бесконечный цикл или слишком медленный алгоритм' : 'не запускался';
      else if (!x.ok) msg = 'ошибка: ' + x.error;
      else {
        ok = (typeof c.cmp === 'function' ? c.cmp : CMP[c.cmp])(x.result, t.args, t.expected);
        msg = ok ? Math.round(x.ms) + ' мс' : (t.expected === undefined ? 'неверный ответ ' + short(x.result) + ': нужны два разных индекса, сумма значений равна target' : 'ожидали ' + short(t.expected, 50) + ', получили ' + short(x.result, 50));
      }
      if (ok) pass++;
      rows += '<li class="' + (ok ? 'ok' : 'bad') + '"><span class="tag">' + (ok ? 'OK' : 'FAIL') + '</span><span class="tcase">' + esc(t.label || t.args.map(function (a) { return short(a, 40); }).join(', ')) + '</span><span class="tmsg">' + esc(msg) + '</span></li>';
    });
    var okAll = pass === r.tests.length, summary = 'пройдено ' + pass + ' из ' + r.tests.length;
    var head = all ? (okAll ? 'Принято' : 'Не принято') : (okAll ? 'Примеры пройдены' : 'Примеры не пройдены');
    return { all: okAll, summary: summary, html: '<div class="res ' + (okAll ? 'ok' : 'bad') + '">' + head + ' · ' + summary + '</div>' + (!all && okAll ? '<p class="muted">Теперь нажми «Отправить»: там большие тесты, и очки начисляются за них.</p>' : '') + '<ul>' + rows + '</ul>' };
  }

  /* ---------- events ---------- */
  function selectCase(id) {
    var c = getCase(id); if (!c) return;
    if (isLocked(c)) { toast('Босс откроется после трёх раскрытых дел'); return; }
    curId = id; state.last = id; delArm = false; leftTab = 'desc'; cTab = 'mentor'; topicsOpen = false; hintsOpen = false; stmtEdit = false; stmtDraft = null; persist(); closeDrawer(); renderCase();
    var lb = $('#leftBody'); if (lb) lb.scrollTop = 0; window.scrollTo({ top: 0 });
  }
  function stepCase(d) {
    var ids = navIds(), nx = ids[ids.indexOf(curId) + d];
    if (nx) selectCase(nx);
  }
  var ACTS = {
    step: function (b) { var p = prog(curId), i = +b.dataset.i; if (!sceneOpen(p, i)) { toast('Сначала закончи предыдущую сцену'); return; } if (SCENES[i].id === 'code' && !p.results[SCENES[i - 1].id]) p.fast = true; p.scene = i; cTab = 'mentor'; persist(); renderCase(); },
    submit: onSubmit, hint1: function () { onHint(1); }, hint2: function () { onHint(2); }, hint3: function () { onHint(3); }, ask: onAsk, review: onReview,
    run: function () { runCode(false); }, submitCode: function () { runCode(true); },
    formula: function () { var q = $('#qbox'); if (!q.value.trim()) q.value = 'Я хочу … (цель этой сцены).\nЯ уже попробовал … .\nОжидал … , а получилось … (или: не понимаю, как перейти от … к … ).\nМоя гипотеза: … .'; q.focus(); },
    toCode: function () { var p = prog(curId); p.fast = true; p.scene = SCENES.length - 2; cTab = 'mentor'; leftTab = 'desc'; persist(); renderCase(); toast('Сразу к коду. Остальные сцены можно пройти позже.'); },
    next: function () { var p = prog(curId); p.scene = Math.min(p.scene + 1, SCENES.length - 1); cTab = 'mentor'; persist(); renderCase(); },
    skip: function () { var c = curCase(), p = prog(c.id), sc = SCENES[p.scene]; p.results[sc.id] = { res: 'PARTIAL', xp: 0 }; p.lastRes[sc.id] = 'PARTIAL'; if (!p.done && canClose(p)) closeCase(c, p); persist(); afterSettle(c, sc); },
    stop: function () { if (ctl) ctl.abort(); },
    nextCase: function () { var nx = nextOpenCase(curCase()); if (nx) selectCase(nx.id); },
    toggleConsole: function () { if (consoleOpen) closeConsole(); else openConsole(); },
    toggleTopics: function () { topicsOpen = !topicsOpen; renderLeft(); },
    toggleHints: function () { hintsOpen = !hintsOpen; renderLeft(); },
    hintMenu: function () { var m = $('#hintMenu'); if (m) m.hidden = !m.hidden; },
    askOpen: function () { hideHintMenu(); setCTab('ask'); var q = $('#qbox'); if (q) q.focus(); },
    goAch: function () { leftTab = 'ach'; shell.classList.remove('max'); renderLeft(); var lb = $('#leftBody'); if (lb) lb.scrollTop = 0; },
    maxToggle: function () { shell.classList.toggle('max'); },
    resetCode: function () {
      if (!codeArm) { codeArm = true; toast('Нажми ещё раз, чтобы сбросить код к шаблону'); renderRight(); setTimeout(function () { if (codeArm) { codeArm = false; renderRight(); } }, 3000); return; }
      codeArm = false; var c = curCase(), p = prog(c.id); p.code = null; persist(); renderRight();
    },
    star: function (b) { var s = b.dataset.slug; if (state.stars[s]) delete state.stars[s]; else state.stars[s] = 1; persist(); renderDrawer(); },
    dChip: function (b) { dDiff = b.dataset.v; dPage = 0; renderDrawer(); },
    dStarOnly: function () { dStar = !dStar; dPage = 0; renderDrawer(); },
    dPrev: function () { dPage--; renderDrawer(); },
    dNext: function () { dPage++; renderDrawer(); },
    dSortDiff: function () { dSort = { k: 'diff', dir: dSort.k === 'diff' ? -dSort.dir : 1 }; dPage = 0; renderDrawer(); },
    dSortName: function () { dSort = { k: 'title', dir: dSort.k === 'title' ? -dSort.dir : 1 }; dPage = 0; renderDrawer(); },
    saveStmt: function () {
      var c = curCase(), v = ($('#stmtText').value || '').trim();
      if (v.length < 20) { toast('Вставь условие целиком'); return; }
      state.stmts[c.id] = v.slice(0, 6000); stmtEdit = false; stmtDraft = null; persist(); renderLeft(); toast('Условие сохранено');
    },
    genStmt: function () {
      var c = curCase(), t = $('#stmtText'); if (!t) return;
      if (!sampleFn) { toast('Наставник сейчас недоступен'); return; }
      var prev = t.value, id = c.id;
      var prompt = 'Напиши условие задачи «' + c.title + '» (' + c.diff + (c.topics && c.topics[0] ? ', раздел ' + c.topics[0] : '') + ') из списка NeetCode 150, как её обычно формулируют, но СВОИМИ СЛОВАМИ на русском, без копирования оригинала. Формат обычным текстом: 1) условие в 2–4 предложениях; 2) «Пример 1:», «Пример 2:» (и при необходимости 3) в виде «Вход: … Выход: …» с короткой пометкой; 3) «Ограничения:» списком через «- ». Не давай подсказок к решению и не называй приём или структуру данных. Не используй markdown-разметку и код-блоки.';
      stmtDraft = prev; toast('Составляю условие. Прежний текст вернётся, если что-то пойдёт не так.');
      setBusy(true); ctl = new AbortController();
      sampleFn(prompt, { signal: ctl.signal, cache: false, onText: function (u) { stmtDraft = u.text; var el = $('#stmtText'); if (el && curId === id) el.value = u.text; } }).then(function (r) {
        stmtDraft = r.text.trim(); var el = $('#stmtText'); if (el && curId === id) el.value = stmtDraft;
        toast('Проверь условие и нажми «Сохранить условие»');
      }, function (e) {
        stmtDraft = prev; var el = $('#stmtText'); if (el && curId === id) el.value = prev;
        toast(e && e.code === 'cancelled' ? 'Отменено, прежнее условие на месте' : (ERR[e && e.code] || 'Не получилось составить условие, прежний текст сохранён.'));
      }).then(function () { ctl = null; setBusy(false); });
    },
    resetStmt: function () { var c = curCase(); delete state.stmts[c.id]; stmtEdit = false; stmtDraft = null; persist(); renderLeft(); toast('Вернул встроенное условие'); },
    editStmt: function () { stmtEdit = true; stmtDraft = null; renderLeft(); var t = $('#stmtText'); if (t) t.focus(); },
    cancelStmt: function () { if (ctl) ctl.abort(); stmtEdit = false; stmtDraft = null; renderLeft(); },
    del: function () {
      if (!delArm) { delArm = true; renderLeft(); return; }
      var id = curId; state.custom = state.custom.filter(function (c) { return c.id !== id; }); delete state.cases[id]; delete state.stmts[id]; delArm = false;
      curId = CASES[0].id; persist(); renderCase();
    }
  };
  shell.addEventListener('click', function (e) {
    var t = e.target;
    var b = t.closest('[data-act]');
    if (b && !b.disabled && ACTS[b.dataset.act]) {
      if (b.classList.contains('is-off')) { explainOff(b); return; }
      try { ACTS[b.dataset.act](b); } catch (err) { toast('Ошибка: ' + (err && err.message || err)); if (window.console) console.error(err); }
      return;
    }
    if (t.closest('a.ext')) return;
    var cs = t.closest('[data-case]'); if (cs) { selectCase(cs.dataset.case); return; }
    var lt = t.closest('[data-lt]'); if (lt) { leftTab = lt.dataset.lt; renderLeft(); return; }
    var ct = t.closest('[data-ct]'); if (ct) { setCTab(ct.dataset.ct); if (ct.dataset.ct === 'ask') { var q = $('#qbox'); if (q) q.focus(); } return; }
    if (t.closest('#listBtn')) { if (drawer.hidden) openDrawer(); else closeDrawer(); return; }
    if (t.closest('#dClose') || t === scrim) { closeDrawer(); return; }
    if (t.closest('#prevBtn')) { stepCase(-1); return; }
    if (t.closest('#nextBtn')) { stepCase(1); return; }
    if (t.id === 'resetBtn') {
      if (!resetArm) { resetArm = true; renderLeft(); return; }
      resetArm = false; state = freshState(); curId = CASES[0].id; lastRun = {}; leftTab = 'desc'; persist(); renderAll(); renderDrawer(); toast('Прогресс сброшен'); return;
    }
    if (t.id === 'cMake') {
      var ti = $('#cTitle').value.trim() || 'Моя задача', s = $('#cText').value.trim();
      if (s.length < 20) { toast('Вставь условие задачи целиком'); return; }
      var id = 'u' + Date.now().toString(36); state.custom.push({ id: id, title: ti }); state.stmts[id] = s.slice(0, 6000);
      $('#cTitle').value = ''; $('#cText').value = ''; persist(); selectCase(id); return;
    }
  });
  document.addEventListener('click', function (e) {
    var m = $('#hintMenu'); if (m && !m.hidden && !e.target.closest('#hintMenu') && !e.target.closest('#hintBtn')) m.hidden = true;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (!drawer.hidden) { closeDrawer(); $('#listBtn').focus(); } hideHintMenu(); }
  });
  shell.addEventListener('input', function (e) {
    var p = prog(curId), t = e.target;
    if (t.id === 'dq') { dq = t.value; dPage = 0; renderDrawer(); return; }
    if (t.id === 'bigN') { drawBig(); return; }
    if (t.id === 'stmtText') { stmtDraft = t.value; return; }
    if (t.id === 'answer') p.answers[SCENES[p.scene].id] = t.value;
    else if (t.id === 'code') { p.code = t.value; updEditor(); } else return;
    persist(); updPos();
  });
  shell.addEventListener('scroll', function (e) { if (e.target.id === 'code') syncScroll(); }, true);
  ['keyup', 'mouseup', 'focusin'].forEach(function (ev) { shell.addEventListener(ev, function (e) { if (e.target.id === 'code' || e.target.id === 'answer') updPos(); }); });
  shell.addEventListener('keydown', function (e) {
    if (e.target.id === 'code' && e.key === 'Tab') {
      e.preventDefault(); var t = e.target, s = t.selectionStart; t.value = t.value.slice(0, s) + '  ' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = s + 2; t.dispatchEvent(new Event('input', { bubbles: true }));
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      var b = e.target.id === 'code' ? ($('[data-act="submitCode"]') || $('[data-act="review"]')) : $('[data-act="submit"]'); if (b && !b.disabled) b.click();
    }
    if (e.target.id === 'code' && (e.ctrlKey || e.metaKey) && e.key === "'") { e.preventDefault(); var r = $('[data-act="run"]'); if (r && !r.disabled) r.click(); }
  });

  /* ---------- resizable panes ---------- */
  function saveLayout() { try { localStorage.setItem(LSL, JSON.stringify(layout)); } catch (e) {} }
  function setLeft(pct) { pct = Math.max(28, Math.min(68, pct)); layout.left = pct; split.style.setProperty('--left', pct + '%'); }
  function setCon(h) { h = Math.max(120, Math.min(Math.max(120, paneR.getBoundingClientRect().height - 300), h)); layout.con = h; paneR.style.setProperty('--console', h + 'px'); }
  function bindGutter(el, onMove) {
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (x) {}
      el.classList.add('drag');
      var mv = function (ev) { onMove(ev); };
      var up = function () { el.classList.remove('drag'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); saveLayout(); };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  }
  bindGutter($('#gv'), function (ev) { var r = split.getBoundingClientRect(); setLeft((ev.clientX - r.left) / r.width * 100); });
  bindGutter($('#gh'), function (ev) { var cons = $('#rFoot').getBoundingClientRect(); setCon(cons.top - ev.clientY); });
  $('#gv').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setLeft((layout.left || 44) + (e.key === 'ArrowRight' ? 3 : -3)); saveLayout(); }
  });
  $('#gh').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); setCon((layout.con || 220) + (e.key === 'ArrowUp' ? 24 : -24)); saveLayout(); }
  });
  if (layout.left) setLeft(layout.left);
  if (layout.con) paneR.style.setProperty('--console', layout.con + 'px');

  var lastErrAt = 0;
  function surface(msg) { var n = Date.now(); if (n - lastErrAt > 4000) { lastErrAt = n; toast(msg); } }
  window.addEventListener('error', function (e) { surface('Ошибка в приложении: ' + (e.message || 'неизвестная')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; surface('Ошибка: ' + ((r && (r.message || r.code)) || 'запрос не выполнен')); });

  /* ---------- boot ---------- */
  curId = validStart(state.last);
  renderAll(); renderDrawer();

  setTimeout(syncDraft, 800);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) syncDraft(); });

  var cl = window.claude;
  if (cl && cl.use) {
    cl.use('sample').then(function (s) { sampleFn = s; sampleState = s ? 'ready' : 'off'; refreshNotice(); refreshButtons(); }, function () { sampleState = 'off'; refreshNotice(); });
    Promise.all([cl.use('db'), cl.use('user')]).then(function (a) {
      var db = a[0], user = a[1]; if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return null;
        profileRef = db.doc('data/users/' + id + '/profile');
        return profileRef.get().then(function (snap) {
          if (!snap.exists) { dirty = true; flush(); return null; }
          var d = JSON.parse(JSON.stringify(snap.data()));
          if (d.cases) { adopt(normalize(d), true); flush(); return null; }
          return profileRef.collection('cases').limit(500).get().then(function (qs) {
            var st = normalize(d); st.cases = {}; st.stmts = {};
            qs.docs.forEach(function (x) { var v = JSON.parse(JSON.stringify(x.data() || {})); if (v.progress) st.cases[x.id] = v.progress; if (v.stmt) st.stmts[x.id] = v.stmt; });
            st.custom.forEach(function (c) { if (c.statement) { st.stmts[c.id] = c.statement; delete c.statement; } });
            adopt(st, false);
          });
        });
      });
    }).catch(function () {});
  } else { sampleState = 'off'; refreshNotice(); }
})();
</script>
